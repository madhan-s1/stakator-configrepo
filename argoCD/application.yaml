apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dynamic-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: "https://github.com/madhan-s1/stakator-configrepo.git"
        revision: "release-test"
        directories:
          - path: "*/*"
  template:
    metadata:
      name: "{{path}}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/madhan-s1/stakator-configrepo.git"
        path: "{{path}}"
        targetRevision: release-test
      destination:
        server: "https://kubernetes.default.svc"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
  goTemplate: true  # ✅ Enables Go templating for proper evaluation
